<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Official website of Kava & Pyramids, a DJ duo from Christchurch, New Zealand."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Twitter Card. og:image and twitter:image point at
         /og-image.jpg, which does not exist yet — drop a real 1200x630px
         image at frontend/public/og-image.jpg before social previews will
         show an image. Until then, previews will just show no image, not
         a broken one. -->
    <meta property="og:title" content="Kava & Pyramids" />
    <meta
      property="og:description"
      content="Official website of Kava & Pyramids, a DJ duo from Christchurch, New Zealand."
    />
    <meta property="og:type" content="website" />
    <!-- TODO: og:url below is a placeholder — no production domain is referenced
         anywhere else in this repo. Update it once the real live domain is known. -->
    <meta property="og:url" content="https://kavapyramids.com/" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kava & Pyramids" />
    <meta
      name="twitter:description"
      content="Official website of Kava & Pyramids, a DJ duo from Christchurch, New Zealand."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <title>Kava & Pyramids</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
