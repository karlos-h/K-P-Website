# Netlify deploy config for the Kava & Pyramids frontend (Vite + React SPA).
# In the Netlify dashboard, you can leave "Base directory" blank if this file
# lives at the repo root — Netlify reads it automatically.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These VITE_ values are PUBLIC client-side keys — Vite inlines them into the
  # browser bundle by design, so they necessarily appear in the build output.
  # They are safe there: the YouTube key is read-only and HTTP-referrer
  # restricted to our domain, and the Supabase anon key is a publishable key
  # protected by Row Level Security (see supabase/migrations 018-022). Netlify's
  # secret scanner flags any env value found in output, so we opt these specific
  # public keys out — this does NOT disable scanning for anything else.
  SECRETS_SCAN_OMIT_KEYS = "VITE_YOUTUBE_API_KEY,VITE_SUPABASE_ANON_KEY"

# kavapyramids.com is the canonical domain; send the default Netlify subdomain
# there so Google doesn't index a duplicate site. Matches that exact host only,
# so deploy previews (deploy-preview-N--kavapyramids.netlify.app) and branch
# URLs (main--kavapyramids.netlify.app) keep working. Must stay above the SPA
# fallback — Netlify uses the first matching rule.
[[redirects]]
  from = "https://kavapyramids.netlify.app/*"
  to = "https://kavapyramids.com/:splat"
  status = 301
  force = true

# SPA fallback — every route (e.g. /admin, /media-hub) must serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers applied to every response.
# A strict Content-Security-Policy is intentionally omitted here because this
# site embeds YouTube, SoundCloud, Behold (Instagram), and SociableKit
# (TikTok) widgets — a tight CSP would break those without careful tuning.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
